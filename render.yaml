services:
  - type: web
    name: padel-card
    runtime: static
    buildCommand: "true"
    staticPublishPath: ./
    headers:
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Cache-Control
        value: no-cache, must-revalidate
