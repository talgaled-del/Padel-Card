services:
  - type: web
    name: padel-card
    runtime: static
    buildCommand: "true"
    staticPublishPath: ./
    headers:
      # HTML must be revalidated so it can point at a new /vN/ folder.
      # Query-string busting (?v=N) does not work on Render's CDN (query string is ignored).
      # These headers apply only if the service is managed by this Blueprint.
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /v21/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # AI Rating backend (server/). Free plan sleeps after ~15 min idle; first call can take ~30-60s to wake.
  - type: web
    name: padel-card-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: "npm install --omit=dev"
    startCommand: "node server.js"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        value: https://padel-card.onrender.com,https://padelcard.app,https://www.padelcard.app
